name: Build Microsoft Store MSIX

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      label:
        type: string
        required: true
    secrets:
      ZERIX_DESKTOP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit SHA (40 hex) di albasyir-group/zerix-desktop; wajib commit yang sama dengan Release zerix-v<versi> (EXE/DMG)"
        type: string
        required: true

permissions: {}

concurrency:
  group: zerix-desktop-dist-msix-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: albasyir-group/zerix-desktop

jobs:
  msix:
    name: win-x64-msix (Microsoft Store)
    runs-on: windows-2025
    timeout-minutes: 180
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: "1"
      CI: "true"
      SOURCE_SHA: ${{ inputs.source_sha }}
      # Wajib sama dengan nama yang di-reserve di Partner Center dan productName EXE/DMG di zerix-desktop
      STORE_DISPLAY_NAME: Zerix
      DEFAULT_PLATFORM_ORIGIN: ${{ vars.DEFAULT_PLATFORM_ORIGIN }}
      DEFAULT_INFERENCE_ORIGIN: ${{ vars.DEFAULT_INFERENCE_ORIGIN }}
    steps:
      - name: Validate input
        run: |
          set -euo pipefail
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_sha tidak valid; wajib 40 karakter hex huruf kecil"
            exit 1
          fi
      - name: Validate origins
        run: |
          set -euo pipefail
          for name in DEFAULT_PLATFORM_ORIGIN DEFAULT_INFERENCE_ORIGIN; do
            value="${!name}"
            if ! printf '%s' "$value" | grep -Eq '^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'; then
              echo "::error::$name kosong/tidak valid: '$value'"
              exit 1
            fi
            echo "$name=$value"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dist-tools
          persist-credentials: false
      - name: Move helpers
        run: |
          set -euo pipefail
          tmp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          mkdir -p "$tmp/dist-tools"
          cp -R dist-tools/scripts "$tmp/dist-tools/"
          rm -rf dist-tools
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ZERIX_DESKTOP_DEPLOY_KEY }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$SOURCE_SHA" ]; then
            echo "::error::Checkout $actual != $SOURCE_SHA"
            exit 1
          fi
      - name: Resolve label
        id: label
        env:
          INPUT_LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          label="$INPUT_LABEL"
          if [ -z "$label" ]; then
            version="$(node -p "require('./apps/desktop/package.json').version")"
            label="zerix-v${version}-store.${GITHUB_RUN_NUMBER}"
          fi
          if ! printf '%s' "$label" | grep -Eq '^zerix-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Label '$label' tidak valid; format wajib zerix-vX.Y.Z[-suffix]"
            exit 1
          fi
          echo "TAG=$label" >> "$GITHUB_ENV"
          echo "Label: $label"
      - name: Verify version sync
        env:
          INPUT_LABEL: ${{ inputs.label }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versi package '$version' bukan stabil X.Y.Z; Store menolak prerelease"
            exit 1
          fi
          if [ -n "$INPUT_LABEL" ]; then
            if [ "$INPUT_LABEL" != "zerix-v${version}" ]; then
              echo "::error::Label '$INPUT_LABEL' != zerix-v${version}; versi tag wajib sama dengan versi package di source"
              exit 1
            fi
          else
            if ! prov="$(gh release download "zerix-v${version}" -R "$GITHUB_REPOSITORY" -p provenance.json -O -)"; then
              echo "::error::Release zerix-v${version} tidak ditemukan; MSIX v${version} wajib dibuild dari commit yang sama dengan EXE/DMG di Release zerix-v${version}; fix khusus Store berarti bump versi lalu rilis baru."
              exit 1
            fi
            release_commit="$(PROV="$prov" node -p "JSON.parse(process.env.PROV).source.commit")"
            if [ "$release_commit" != "$SOURCE_SHA" ]; then
              echo "::error::MSIX v${version} wajib dibuild dari commit yang sama dengan EXE/DMG di Release zerix-v${version} (${release_commit}); fix khusus Store berarti bump versi lalu rilis baru. source_sha=${SOURCE_SHA}"
              exit 1
            fi
          fi
          echo "MSIX_VERSION=$version" >> "$GITHUB_ENV"
          echo "Versi sinkron: $version (commit $SOURCE_SHA)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: |
          set -euo pipefail
          expected="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          test "$(pnpm --version)" = "$expected"
          pnpm install --frozen-lockfile
      - name: Configure Windows env
        run: node "$RUNNER_TEMP/dist-tools/scripts/configure-windows-env.mjs"
      - name: Configure tar
        run: |
          set -euo pipefail
          echo "TAR_OPTIONS=--force-local" >> "$GITHUB_ENV"
      - name: Preflight tar
        run: node "$RUNNER_TEMP/dist-tools/scripts/tar-preflight.mjs"
      - name: Validate target
        run: pnpm run package:desktop:win:msix --check
      - name: Package and smoke-test
        run: pnpm run package:desktop:win:msix
      - name: Verify origins in app bundle
        run: |
          set -euo pipefail
          bundle=apps/desktop/lib/main.js
          test -f "$bundle" || { echo "::error::$bundle tidak ada"; exit 1; }
          for name in DEFAULT_PLATFORM_ORIGIN DEFAULT_INFERENCE_ORIGIN; do
            value="${!name}"
            if ! grep -qF "$value" "$bundle"; then
              echo "::error::$name=$value tidak ter-bake di $bundle (source belum mendukung env build ini?)"
              exit 1
            fi
          done
          if grep -qF 'staging-platform' "$bundle"; then
            echo "::error::build production memuat origin staging"
            exit 1
          fi
          echo "Origins OK in $bundle"
      - name: Stage installer
        env:
          DESKTOP_TARGET: win-x64-msix
          DESKTOP_EXTENSION: msix
          RUNNER_LABEL: windows-2025
        run: node "$RUNNER_TEMP/dist-tools/scripts/stage-installer.mjs"
      - name: Verify MSIX manifest (version + display name)
        env:
          MSIX_FILE_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          MSIX_PATH="$MSIX_FILE_DIR/zerix-stage/Zerix-x64.msix" python -c '
          import os, sys, zipfile
          import xml.etree.ElementTree as ET
          path = os.environ["MSIX_PATH"]
          expected = os.environ["MSIX_VERSION"] + ".0"
          expected_name = os.environ["STORE_DISPLAY_NAME"]
          with zipfile.ZipFile(path) as z:
              root = ET.fromstring(z.read("AppxManifest.xml"))
          def local(t): return t.rsplit("}", 1)[-1]
          ident = next(e for e in root.iter() if local(e.tag) == "Identity")
          props = next((e for e in root.iter() if local(e.tag) == "Properties"), None)
          name = None
          if props is not None:
              name = next((e.text for e in props if local(e.tag) == "DisplayName"), None)
          actual = ident.get("Version")
          print("Identity Version:", actual)
          print("DisplayName:", name)
          if actual != expected:
              print("::error::Identity Version %s != %s" % (actual, expected))
              sys.exit(1)
          if name != expected_name:
              print("::error::DisplayName '%s' != '%s'; harus sama dengan nama yang di-reserve di Partner Center" % (name, expected_name))
              sys.exit(1)
          '
      - name: Term guard (staged files)
        run: |
          set -euo pipefail
          stage="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")/zerix-stage"
          args=()
          for f in "$stage"/*; do
            case "$f" in
              *.txt|*.json) args+=(--file "staged=$f") ;;
              *) args+=(--text "staged name=$(basename "$f")") ;;
            esac
          done
          node "$RUNNER_TEMP/dist-tools/scripts/term-guard.mjs" "${args[@]}"
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerix-msix-${{ env.TAG }}
          path: ${{ runner.temp }}/zerix-stage
          if-no-files-found: error
          retention-days: 30
